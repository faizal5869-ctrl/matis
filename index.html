<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meeting.ai Studio - Full Local Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

<div class="w-full max-w-2xl bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700">
    <div class="flex items-center justify-between mb-4 border-b border-slate-700 pb-3">
        <div>
            <h1 class="font-bold text-xl text-white">Meeting.ai Studio</h1>
            <p class="text-xs text-slate-400">Mod Tempatan (Local Studio)</p>
        </div>
        <span id="status-badge" class="text-xs bg-emerald-500/20 text-emerald-400 font-semibold px-3 py-1 rounded-full border border-emerald-500/30">Sedia</span>
    </div>

    <!-- Bahagian Input Teks & Nota -->
    <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-300 mb-1">Nota, Transkrip atau Agenda Perbualan:</label>
        <textarea id="transcript-box" rows="5" class="w-full p-3 text-sm bg-slate-900 border border-slate-700 rounded-xl text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Taip atau tampal nota mesyuarat di sini..."></textarea>
    </div>

    <!-- Kotak Hasil Rumusan AI & Mind Map / Grafik Poin -->
    <div class="mb-6">
        <label class="block text-xs font-semibold text-slate-300 mb-1">Rumusan AI & Struktur Poin Penting (Mind Map Visual):</label>
        <div id="ai-summary" class="w-full p-4 text-sm bg-indigo-950/40 border border-indigo-500/30 rounded-xl text-indigo-200 min-h-[120px] space-y-2">
            <span class="text-slate-400 italic">Klik butang di bawah untuk menjana rumusan dan struktur mind map automatik...</span>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <button onclick="resetApp()" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2.5 px-4 rounded-xl text-sm transition-colors cursor-pointer">
            🔄 Reset Sesi
        </button>
        <button onclick="generateAISummary()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 px-4 rounded-xl text-sm transition-colors cursor-pointer shadow-lg shadow-indigo-600/3
