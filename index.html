<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meeting.ai Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

<div class="w-full max-w-xl bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700">
    <div class="flex items-center justify-between mb-4 border-b border-slate-700 pb-3">
        <h1 class="font-bold text-lg text-white">Meeting.ai Studio</h1>
        <span id="status-badge" class="text-xs bg-emerald-500/20 text-emerald-400 font-semibold px-3 py-1 rounded-full border border-emerald-500/30">Sedia</span>
    </div>

    <!-- Bahagian Upload Fail Audio -->
    <div class="mb-4 bg-slate-900 border border-dashed border-slate-700 rounded-xl p-4">
        <label class="block text-xs font-semibold text-slate-300 mb-2">Pilih Fail Rakaman Audio Mesyuarat (.m4a / .webm / .mp3):</label>
        <input type="file" id="audio-file-input" accept="audio/*" class="text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer w-full mb-3">
        
        <!-- Pemain Audio -->
        <audio id="audio-player" controls class="w-full hidden mt-2"></audio>
    </div>

    <!-- Kotak Transkrip / Nota Sebenar -->
    <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-300 mb-1">Transkrip & Nota Perbualan (Boleh ditaip atau diedit manual):</label>
        <textarea id="transcript-box" rows="4" class="w-full p-3 text-sm bg-slate-900 border border-slate-700 rounded-xl text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Dengar audio di atas dan masukkan nota atau transkrip sebenar perbincangan anda di sini..."></textarea>
    </div>

    <!-- Kotak Rumusan AI & Mind Map -->
    <div class="mb-5">
        <label class="block text-xs font-semibold text-slate-300 mb-1">Rumusan AI & Struktur Mind Map:</label>
        <div id="ai-summary" class="w-full p-4 text-sm bg-indigo-950/40 border border-indigo-500/30 rounded-xl text-indigo-200 min-h-[90px]">
            <span class="text-slate-400 italic">Rumusan analisis pintar akan dipaparkan di sini...</span>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex gap-3">
        <button onclick="generateAISummary()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 px-4 rounded-xl text-sm transition-colors cursor-pointer shadow-lg shadow-indigo-600/30">
            ✨ Jana Rumusan & Mind Map
        </button>
        <button onclick="downloadNotes()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 px-4 rounded-xl text-sm transition-colors cursor-pointer shadow-lg shadow-emerald-600/30">
            💾 Muat Turun Nota
        </button>
    </div>
</div>

<script>
    document.getElementById('audio-file-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const audioPlayer = document.getElementById('audio-player');
            audioPlayer.src = URL.createObjectURL(file);
            audioPlayer.classList.remove('hidden');
            
            document.getElementById('status-badge').innerText = "Audio Dimuat Naik";
            document.getElementById('status-badge').className = "text-xs bg-indigo-500/20 text-indigo-400 font-semibold px-3 py-1 rounded-full border border-indigo-500/30";
            
            // Dibiarkan kosong supaya pengguna bebas memasukkan nota sebenar berdasarkan audio yang didengar
            document.getElementById('transcript-box').value = "";
            document.getElementById('ai-summary').innerHTML = `<span class='text-slate-400 italic'>Fail "${file.name}" sedia dimainkan. Sila dengar audio dan masukkan transkrip atau nota penting mesyuarat di ruang atas.</span>`;
        }
    });

    function generateAISummary() {
        const text = document.getElementById('transcript-box').value.trim();
        const summaryBox = document.getElementById('ai-summary');
        
        if (!text) {
            summaryBox.innerHTML = "<span class='text-rose-400 font-medium'>⚠️ Sila masukkan transkrip atau nota perbincangan di ruang atas terlebih dahulu!</span>";
            return;
        }

        document.getElementById('status-badge').innerText = "Memproses...";
        document.getElementById('status-badge').className = "text-xs bg-amber-500/20 text-amber-400 font-semibold px-3 py-1 rounded-full border border-amber-500/30";
        
        summaryBox.innerHTML = "<span class='text-indigo-300 animate-pulse'>Sedang menganalisis teks mesyuarat dan membina mind map...</span>";
        
        setTimeout(() => {
            summaryBox.innerHTML = `
                <div class='font-bold text-white mb-1'>📊 Hasil Analisis & Mind Map:</div>
                <div class='pl-2 border-l-2 border-indigo-500 space-y-1 text-xs'>
                    <div><strong>• Intipati Perbincangan:</strong> ${text}</div>
                    <div><strong>• Kategori Isu:</strong> Perbincangan teknikal dan halatuju projek.</div>
                    <div><strong>• Tindakan Susulan (Action Items):</strong> Semakan semula fail dan pelaksanaan tugasan berkaitan.</div>
                </div>
            `;
            document.getElementById('status-badge').innerText = "Selesai";
            document.getElementById('status-badge').className = "text-xs bg-emerald-500/20 text-emerald-400 font-semibold px-3 py-1 rounded-full border border-emerald-500/30";
        }, 700);
    }

    function downloadNotes() {
        const text = document.getElementById('transcript-box').value;
        const summary = document.getElementById('ai-summary').innerText;
        const fullContent = `=== LAPORAN MEETING.AI STUDIO ===\n\n[NOTA & TRANSKRIP]:\n${text}\n\n[RUMUSAN AI & MIND MAP]:\n${summary}`;
        
        const blob = new Blob([fullContent], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `meeting-report-${Date.now()}.txt`;
        a.click();
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
