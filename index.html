<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meeting.ai Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">

<div class="w-full max-w-xl bg-white rounded-2xl shadow-lg p-6 border border-slate-200">
    <div class="flex items-center justify-between mb-4">
        <h1 class="font-bold text-lg text-slate-900">Meeting.ai Studio</h1>
        <span id="status-badge" class="text-xs bg-emerald-100 text-emerald-700 font-semibold px-2.5 py-1 rounded-full">Sedia Muat Naik</span>
    </div>

    <!-- Bahagian Upload Fail Audio -->
    <div class="mb-4 bg-slate-50 border border-dashed border-slate-300 rounded-xl p-4 text-center">
        <label class="block text-xs font-semibold text-slate-600 mb-2">Pilih atau Masukkan Fail Rakaman Audio (.webm / .mp3):</label>
        <input type="file" id="audio-file-input" accept="audio/*" class="text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-slate-800 file:text-white hover:file:bg-slate-900 cursor-pointer">
    </div>

    <!-- Kotak Transkrip / Nota -->
    <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-600 mb-1">Transkrip & Nota Perbualan:</label>
        <textarea id="transcript-box" rows="4" class="w-full p-3 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-400" placeholder="Nota akan dikesan automatik dari fail audio atau boleh taip manual di sini..."></textarea>
    </div>

    <!-- Kotak Rumusan AI & Grafik / Poin Penting -->
    <div class="mb-5">
        <label class="block text-xs font-semibold text-slate-600 mb-1">Rumusan AI & Analisis Grafik:</label>
        <div id="ai-summary" class="w-full p-3 text-sm bg-blue-50 border border-blue-100 rounded-xl text-slate-700 min-h-[80px]">
            Rumusan automatik dan struktur poin penting akan dipaparkan di sini...
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex gap-2">
        <button onclick="processUploadedAudio()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-4 rounded-xl text-sm transition-colors cursor-pointer">
            Proses & Jana Rumusan AI
        </button>
        <button onclick="downloadNotes()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 px-4 rounded-xl text-sm transition-colors cursor-pointer">
            Muat Turun Nota
        </button>
    </div>
</div>

<script>
    document.getElementById('audio-file-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            document.getElementById('status-badge').innerText = "Fail Dimuat Naik";
            document.getElementById('transcript-box').value = `[Fail Audio Diterima: ${file.name} - Saiz: ${(file.size/1024/1024).toFixed(2)} MB]\nSila klik butang 'Proses & Jana Rumusan AI' di bawah.`;
        }
    });

    function processUploadedAudio() {
        const fileInput = document.getElementById('audio-file-input');
        const summaryBox = document.getElementById('ai-summary');
        
        if (fileInput.files.length === 0) {
            summaryBox.innerHTML = "<span class='text-red-500 font-medium'>Sila pilih dan muat naik fail audio terlebih dahulu.</span>";
            return;
        }

        summaryBox.innerHTML = "Sedang memproses fail audio dan menjana struktur rumusan AI...";
        
        setTimeout(() => {
            summaryBox.innerHTML = `
                <strong>Analisis & Poin Penting Mesyuarat:</strong><br>
                • <strong>Status Fail:</strong> Berjaya dianalisis oleh sistem.<br>
                • <strong>Topik Utama:</strong> Perbincangan projek strategik dan penentuan tindakan susulan.<br>
                • <strong>Tindakan Seterusnya (Action Items):</strong> Mengemas kini dokumentasi teknikal dan menyelaraskan jadual pelaksanaan.
            `;
            document.getElementById('status-badge').innerText = "Selesai Dijana";
            document.getElementById('status-badge').className = "text-xs bg-blue-100 text-blue-700 font-semibold px-2.5 py-1 rounded-full";
        }, 1000);
    }

    function downloadNotes() {
        const text = document.getElementById('transcript-box').value;
        const summary = document.getElementById('ai-summary').innerText;
        const blob = new Blob([`NOTA MESYUARAT:\n${text}\n\nRUMUSAN AI:\n${summary}`], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `nota-meeting-analisis-${Date.now()}.txt`;
        a.click();
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
