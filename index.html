<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meeting.ai Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">

<div class="w-full max-w-xl bg-white rounded-2xl shadow-lg p-6 border border-slate-200">
    <div class="flex items-center justify-between mb-4">
        <h1 class="font-bold text-lg text-slate-900">Meeting.ai Studio</h1>
        <span id="status-badge" class="text-xs bg-amber-100 text-amber-700 font-semibold px-2.5 py-1 rounded-full">Bersedia</span>
    </div>

    <!-- Timer / Display -->
    <div id="display-box" class="bg-slate-50 border border-slate-200 rounded-xl p-4 text-center mb-4">
        <div id="timer" class="text-3xl font-black text-slate-800">00:00</div>
        <p id="status-text" class="text-xs text-slate-500 mt-1">Sistem siap untuk digunakan</p>
    </div>

    <!-- Kotak Nota / Transkrip -->
    <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-600 mb-1">Nota & Transkrip Perbualan:</label>
        <textarea id="transcript-box" rows="5" class="w-full p-3 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-400" placeholder="Taip nota mesyuarat atau hasil perbincangan di sini..."></textarea>
    </div>

    <!-- Kotak Hasil Rumusan AI -->
    <div class="mb-5">
        <label class="block text-xs font-semibold text-slate-600 mb-1">Rumusan & Poin Penting AI:</label>
        <div id="ai-summary" class="w-full p-3 text-sm bg-blue-50 border border-blue-100 rounded-xl text-slate-700 min-h-[80px]">
            Rumusan automatik akan dipaparkan di sini selepas anda klik butang jana...
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="grid grid-cols-2 gap-2 mb-2">
        <button onclick="handleNewNote()" class="bg-slate-800 hover:bg-slate-900 text-white font-semibold py-2.5 px-4 rounded-xl text-sm transition-colors cursor-pointer">
            + Sesi Baharu
        </button>
        <button id="rec-btn" onclick="toggleRecord()" class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2.5 px-4 rounded-xl text-sm transition-colors cursor-pointer">
            Mula Rakam
        </button>
    </div>
    <div class="flex gap-2">
        <button onclick="generateAISummary()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px
